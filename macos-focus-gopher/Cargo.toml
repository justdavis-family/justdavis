[package]
name = "macos-focus-gopher"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Per-user macOS helper that reports the current Focus / Do Not Disturb state over a local socket."
license = "MIT"
repository = "https://github.com/justdavis-family/justdavis"
publish = false
default-run = "focus-gopherd"

[lib]
name = "macos_focus_gopher"
path = "src/lib.rs"

[[bin]]
name = "focus-gopherd"
path = "src/bin/focus-gopherd.rs"

[[bin]]
name = "focus-gopher"
path = "src/bin/focus-gopher.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[dev-dependencies]
jsonschema = "0.26"
tempfile = "3"

[profile.release]
strip = true

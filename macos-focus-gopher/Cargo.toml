[package]
name = "macos-focus-gopher"
version = "0.1.0"
edition = "2021"
description = "Per-user macOS helper that reports the current Focus / Do Not Disturb state over a local socket."
license = "MIT"
repository = "https://github.com/justdavis-family/justdavis"
publish = false
default-run = "focus-gopherd"

[lib]
name = "macos_focus_gopher"
path = "src/lib.rs"

[[bin]]
name = "focus-gopherd"
path = "src/bin/focus-gopherd.rs"

[[bin]]
name = "focus-gopher"
path = "src/bin/focus-gopher.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
signal-hook = "0.3"

[dev-dependencies]
# default-features = false drops the remote-`$ref` resolver (reqwest/hyper/tokio/
# tower/...); the schema uses only internal `#/$defs` refs, so core validation is
# unaffected — and the dependency graph (and compile time) shrinks substantially.
jsonschema = { version = "0.26", default-features = false }
tempfile = "3"
# Drives the `focus-gopher` CLI binary as a subprocess in tests/cli_roundtrip.rs;
# locates the test build via `CARGO_BIN_EXE_focus-gopher` and offers ergonomic
# assertions on stdout / stderr / exit status.
assert_cmd = "2"

[profile.release]
strip = true
